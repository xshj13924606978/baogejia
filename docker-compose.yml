services:
  # 中文 OCR 识别服务（RapidOCR + ONNX Runtime）
  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: quote-ocr-service
    restart: unless-stopped
    networks:
      - quote-network
    environment:
      - TZ=Asia/Shanghai
    # 不对外暴露端口，仅供内网服务间调用（调试时可临时放开）
    # ports:
    #   - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://xs-bj.com}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - WECHAT_APP_ID=${WECHAT_APP_ID}
        - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
    depends_on:
      ocr-service:
        condition: service_healthy
    container_name: quote-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COZE_API_KEY=${COZE_API_KEY}
      - TENCENT_SMS_SECRET_ID=${TENCENT_SMS_SECRET_ID}
      - TENCENT_SMS_SECRET_KEY=${TENCENT_SMS_SECRET_KEY}
      - TENCENT_SMS_SDK_APP_ID=${TENCENT_SMS_SDK_APP_ID}
      - TENCENT_SMS_SIGN_NAME=${TENCENT_SMS_SIGN_NAME}
      - TENCENT_SMS_TEMPLATE_ID=${TENCENT_SMS_TEMPLATE_ID}
      - SESSION_TOKEN_SECRET=${SESSION_TOKEN_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://xs-bj.com}
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      - OCTOPUS_RPA_API_KEY=${OCTOPUS_RPA_API_KEY}
      - OCTOPUS_RPA_API_URL=${OCTOPUS_RPA_API_URL:-https://mcp-rpa.bazhuayu.com}
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-http://ocr-service:8000}
      - ENABLE_OCR_SERVICE=${ENABLE_OCR_SERVICE:-true}
      - ENABLE_VISION_AI=${ENABLE_VISION_AI:-false}
    volumes:
      - ./tmp:/tmp
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - quote-network

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: quote-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - quote-network

networks:
  quote-network:
    driver: bridge