# .cnb.yml
main:
  push:
    - stages:
        - name: 构建项目
          image: node:20-slim
          script:
            - cat .env.ci
            - export $(cat .env.ci | xargs)
            - echo "URL: $NEXT_PUBLIC_SUPABASE_URL"
            - corepack enable
            - corepack prepare pnpm@8 --activate
            - pnpm install --frozen-lockfile
            - pnpm run type-check
            - pnpm run build
