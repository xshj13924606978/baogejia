events {
    worker_connections 1024;
}

http {
    upstream quote_app {
        server app:5000;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name xs-bj.com www.xs-bj.com 193.112.123.218;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主配置
    server {
        listen 443 ssl http2;
        server_name xs-bj.com www.xs-bj.com;

        ssl_certificate /etc/nginx/ssl/xs-bj.com_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/xs-bj.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 日志配置
        access_log /var/log/nginx/quote-app-access.log;
        error_log /var/log/nginx/quote-app-error.log;

        # 静态文件缓存
        location /_next/static {
            proxy_pass http://quote_app;
            expires 365d;
        }

        location /static {
            proxy_pass http://quote_app;
            expires 365d;
        }

        # API 请求
        location /api {
            proxy_pass http://quote_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 主应用
        location / {
            proxy_pass http://quote_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}