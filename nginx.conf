events {
    worker_connections 2048;
    multi_accept on;
}

http {
    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    client_max_body_size 50M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream quote_app {
        server app:5000;
        keepalive 32;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name xs-bj.com www.xs-bj.com 193.112.123.218;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主配置
    server {
        listen 443 ssl http2;
        server_name xs-bj.com www.xs-bj.com;

        # SSL 证书
        ssl_certificate /etc/nginx/ssl/xs-bj.com_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/xs-bj.com.key;

        # SSL 优化
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # 日志配置
        access_log /var/log/nginx/quote-app-access.log;
        error_log /var/log/nginx/quote-app-error.log;

        # 通用 proxy 配置
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;

        # 静态文件缓存
        location /_next/static {
            proxy_pass http://quote_app;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        location /static {
            proxy_pass http://quote_app;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # manifest.json 和 favicon 等静态资源
        location = /manifest.json {
            proxy_pass http://quote_app;
            proxy_set_header Host $host;
            expires 1d;
            add_header Cache-Control "public";
        }

        location = /favicon.ico {
            proxy_pass http://quote_app;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # API 请求（WebSocket 支持）
        location /api {
            proxy_pass http://quote_app;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 主应用
        location / {
            proxy_pass http://quote_app;
        }
    }
}